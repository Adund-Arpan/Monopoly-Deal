<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Deal — property card game</title>
<style>
:root{
  --felt:#12613a; --felt-dk:#06301c; --rail:#4a2f18;
  --paper:#fbfaf4; --ink:#14171c; --line:#0d0f12;
  --gold:#e8c35a; --dim:#a9c0b2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font:400 15px/1.45 "Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
  color:#eaf3ee;
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, #1a7a49 0%, var(--felt) 40%, var(--felt-dk) 100%);
  overflow:hidden;
}
button{font:inherit;cursor:pointer;border:0}
.btn{
  background:var(--gold);color:#20170a;font-weight:700;padding:10px 18px;border-radius:4px;
  border:2px solid #7d6320;box-shadow:0 2px 0 #7d6320;letter-spacing:.2px;
}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:#dfeee6;border:2px solid #4d7b63;box-shadow:none}
.btn.red{background:#d8443c;color:#fff;border-color:#8c2620;box-shadow:0 2px 0 #8c2620}
.btn.sm{padding:6px 11px;font-size:13px}
input{font:inherit;padding:10px 12px;border-radius:4px;border:2px solid #2d5b45;background:#0b2a1c;color:#eaf3ee;width:100%}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ───────── lobby ───────── */
#lobby{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;z-index:50}
.panel{width:100%;max-width:420px;background:rgba(4,28,17,.86);border:2px solid #2d5b45;border-radius:10px;padding:26px}
.logo{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:.9;margin:0 0 2px;color:var(--gold)}
.logo span{display:block;font-size:13px;font-weight:600;letter-spacing:4px;color:#8fb3a0;margin-top:8px}
.lrow{margin:14px 0}
.lbl{font-size:13px;color:#8fb3a0;margin-bottom:5px}
.code{font-size:46px;font-weight:800;letter-spacing:10px;color:var(--gold);text-align:center;
  background:#07231663;border:2px dashed #2d5b45;border-radius:8px;padding:12px 0 12px 10px}
.plist{list-style:none;padding:0;margin:10px 0}
.plist li{padding:7px 10px;background:#0b2a1c;border-radius:4px;margin-bottom:5px;font-size:14px}
.err{color:#ff9d94;font-size:13px;min-height:18px;margin-top:8px}
.hint{font-size:12.5px;color:#7fa392;line-height:1.5}

/* ───────── table ───────── */
#game{display:none;position:fixed;inset:0;flex-direction:column}
#top{flex:1;overflow-y:auto;padding:8px 10px 0;display:flex;flex-direction:column;gap:7px}
#bottom{flex:0 0 auto;background:linear-gradient(#062b1a,#04200f);border-top:3px solid var(--rail);padding:6px 10px 8px}

.pl{background:rgba(3,26,15,.55);border:1px solid #23503a;border-radius:7px;padding:6px 8px}
.pl.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pl.me{background:rgba(6,40,24,.75)}
.plh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:5px}
.nm{font-weight:700;font-size:15px}
.tag{background:#0e3f27;border:1px solid #2a6244;border-radius:20px;padding:1px 9px;font-size:11.5px;color:#b9d6c6}
.tag.win{background:#6a5210;border-color:var(--gold);color:#ffe9a8}
.board{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;min-height:34px}
.empty{color:#5f8672;font-size:12px;font-style:italic;padding:6px 0}
.setcol{display:flex;flex-direction:column;align-items:center;gap:2px}
.stack{position:relative;display:flex;flex-direction:column}
.stack .mini+.mini{margin-top:-52px}
.setinfo{font-size:10.5px;color:#9fc0ae;white-space:nowrap}
.setinfo b{color:var(--gold)}
.setcol.done .setinfo{color:#ffe9a8}
.bld{display:flex;gap:2px;margin-top:2px}
.bpip{font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;background:#1e6b3d;color:#fff;border:1px solid #0d3f22}
.bpip.h{background:#b03a2e;border-color:#6d1f17}
.bank{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;background:#f0e3c2;color:#20170a;border:1px solid #8a7443}

/* ───────── cards ───────── */
.card{
  width:106px;height:152px;flex:0 0 auto;position:relative;overflow:hidden;
  background:var(--paper);border:2px solid var(--line);border-radius:8px;color:var(--ink);
  box-shadow:0 3px 7px rgba(0,0,0,.5);
}
.card.sel{outline:3px solid var(--gold);outline-offset:2px;transform:translateY(-10px)}
.card.pick{cursor:pointer}
.card.dim{filter:grayscale(.7) brightness(.62)}
.val{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;
  border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:800;z-index:4}
.val.b{top:auto;left:auto;bottom:3px;right:3px}
.band{display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:700;font-size:10.5px;line-height:1.08;padding:3px 4px;color:#fff;
  text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--line)}
.band.h1{height:58px}
.band.h2{height:37px}
.rents{padding:3px 6px;font-size:9px}
.rents .r{display:flex;justify-content:space-between;border-bottom:1px dotted #c3c3b8;padding:1.5px 0}
.rents .r b{font-weight:800}
.split{display:flex;height:58px;border-bottom:2px solid var(--line)}
.split>div{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:700;font-size:9px;padding:2px;color:#fff;text-transform:uppercase;line-height:1.05}
.split>div+div{border-left:2px solid var(--line)}
.cols2{display:flex;font-size:8px}
.cols2>div{flex:1;padding:3px 4px}
.cols2>div+div{border-left:1px solid #ddd}
.cols2 .r{display:flex;justify-content:space-between;padding:1px 0}
.desc{padding:5px 7px 22px;font-size:8.6px;line-height:1.25;text-align:center;color:#333}
.actname{font-weight:800;font-size:12px;line-height:1.05;text-transform:uppercase}
.moneyface{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.moneyface .big{font-size:40px;font-weight:800;line-height:1}
.moneyface .sub{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;opacity:.75}
.rainbow{background:linear-gradient(100deg,#7c4a1e 0 10%,#9fdcf5 10% 20%,#d5399a 20% 30%,#f28f1c 30% 40%,#e0202a 40% 50%,#f5e01c 50% 60%,#149a4e 60% 70%,#1064b0 70% 80%,#232323 80% 90%,#8fc740 90% 100%);
  text-shadow:0 1px 3px rgba(0,0,0,.9)}
.rentbig{font-size:19px;font-weight:800;letter-spacing:1px}

/* mini board card */
.mini{width:54px;height:76px;flex:0 0 auto;position:relative;overflow:hidden;
  background:var(--paper);border:1.5px solid var(--line);border-radius:5px;color:var(--ink);
  box-shadow:0 1px 3px rgba(0,0,0,.5)}
.mini .mband{height:30px;display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:6.5px;font-weight:700;text-align:center;line-height:1.05;padding:1px 2px;
  text-transform:uppercase;border-bottom:1px solid var(--line)}
.mini .mtxt{font-size:6.5px;padding:2px 3px;line-height:1.15;color:#333;text-align:center}
.mini .mv{position:absolute;bottom:2px;right:3px;font-size:7.5px;font-weight:800}
.mini.pick{cursor:pointer}
.mini.pick:hover{outline:2px solid var(--gold)}
.mini.sel{outline:3px solid var(--gold)}

/* ───────── hand ───────── */
#handbar{display:flex;align-items:flex-end;gap:8px}
#hand{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 6px;flex:1;scrollbar-width:thin}
#hand .card{cursor:pointer;transition:transform .12s}
#hand .card:hover{transform:translateY(-8px)}
#ctl{display:flex;flex-direction:column;gap:5px;align-items:stretch;flex:0 0 auto;padding-bottom:6px}
#turnbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;padding:2px 0 4px}
.pips{display:flex;gap:3px}
.pip{width:11px;height:11px;border-radius:50%;background:#0c3d26;border:1.5px solid #2f6b4c}
.pip.on{background:var(--gold);border-color:#a8871f}
#msg{font-weight:700;color:var(--gold)}

/* ───────── log ───────── */
#logbox{background:rgba(2,20,12,.6);border:1px solid #23503a;border-radius:7px;padding:6px 9px;
  font-size:12.2px;max-height:104px;overflow-y:auto;color:#bcd8c8;line-height:1.5}
#logbox div{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.04)}
#logbox b{color:#fff}

/* ───────── modal ───────── */
#modal{position:fixed;inset:0;background:rgba(0,10,5,.78);display:none;align-items:center;
  justify-content:center;padding:14px;z-index:60}
#modal.on{display:flex}
.mbox{background:#083220;border:2px solid #2d5b45;border-radius:10px;padding:18px;
  max-width:min(720px,100%);max-height:92vh;overflow-y:auto;width:100%}
.mtitle{font-size:19px;font-weight:800;margin:0 0 4px;color:var(--gold)}
.msub{font-size:13.5px;color:#a9c8b6;margin:0 0 14px;line-height:1.5}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px;
  position:sticky;bottom:-18px;background:#083220;padding-top:10px}
.grp{margin-bottom:14px}
.grph{font-size:13px;font-weight:700;color:#cfe6da;margin-bottom:6px;
  border-bottom:1px solid #23503a;padding-bottom:4px}
.opt{display:block;width:100%;text-align:left;background:#0c3d26;border:2px solid #2a6244;
  color:#eaf3ee;padding:11px 13px;border-radius:6px;margin-bottom:7px;font-size:14.5px}
.opt:hover{border-color:var(--gold)}
.opt small{display:block;color:#93b6a3;font-size:12px;margin-top:2px}
.paychip{display:flex;align-items:center;gap:6px;background:#0c3d26;border:2px solid #2a6244;
  border-radius:6px;padding:7px 11px;font-size:13px;color:#eaf3ee;cursor:pointer}
.paychip.on{border-color:var(--gold);background:#1d5537}
.tally{font-size:15px;font-weight:700;margin-bottom:10px}
.tally.ok{color:#8ce6a8}
.tally.no{color:#ffb3ab}

#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#0b3a24;
  border:2px solid var(--gold);color:#ffe9a8;padding:9px 16px;border-radius:6px;font-weight:700;
  z-index:80;display:none;font-size:14px;max-width:90vw;text-align:center}

@media(max-width:640px){
  .card{width:88px;height:127px}
  .band.h1,.split{height:48px}
  .band.h2{height:30px}
  .desc{font-size:8px;padding:4px 5px 20px}
  .rents{font-size:8.4px}
  .mini{width:46px;height:65px}
  .stack .mini+.mini{margin-top:-44px}
  .logo{font-size:36px}
  #logbox{max-height:76px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="lobby">
  <div class="panel" id="lpanel"></div>
</div>

<div id="game">
  <div id="top">
    <div id="others"></div>
    <div id="logbox"></div>
    <div id="mine"></div>
  </div>
  <div id="bottom">
    <div id="turnbar"></div>
    <div id="handbar">
      <div id="hand"></div>
      <div id="ctl"></div>
    </div>
  </div>
</div>

<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";

/* ══════════════ CARD DATA ══════════════
   Deck composition follows the retail game. Everything here is plain data —
   edit the tables below to rebalance the deck.                              */

var CLR = {
  brown : {n:'Brown',       c:'#7c4a1e', s:2, r:[1,2]},
  lblue : {n:'Light Blue',  c:'#9fdcf5', s:3, r:[1,2,3], d:1},
  pink  : {n:'Pink',        c:'#d5399a', s:3, r:[1,2,4]},
  orange: {n:'Orange',      c:'#f28f1c', s:3, r:[1,3,5]},
  red   : {n:'Red',         c:'#e0202a', s:3, r:[2,3,6]},
  yellow: {n:'Yellow',      c:'#f5e01c', s:3, r:[2,4,6], d:1},
  green : {n:'Green',       c:'#149a4e', s:3, r:[2,4,7]},
  blue  : {n:'Dark Blue',   c:'#1064b0', s:2, r:[3,8]},
  rail  : {n:'Railroad',    c:'#232323', s:4, r:[1,2,3,4]},
  util  : {n:'Utility',     c:'#8fc740', s:2, r:[1,2], d:1}
};
var ORDER = ['brown','lblue','pink','orange','red','yellow','green','blue','rail','util'];

var PROPS = [
  ['brown','Mediterranean Ave',1],['brown','Baltic Ave',1],
  ['lblue','Oriental Ave',1],['lblue','Vermont Ave',1],['lblue','Connecticut Ave',1],
  ['pink','St. Charles Place',2],['pink','States Ave',2],['pink','Virginia Ave',2],
  ['orange','St. James Place',2],['orange','Tennessee Ave',2],['orange','New York Ave',2],
  ['red','Kentucky Ave',3],['red','Indiana Ave',3],['red','Illinois Ave',3],
  ['yellow','Atlantic Ave',3],['yellow','Ventnor Ave',3],['yellow','Marvin Gardens',3],
  ['green','Pacific Ave',4],['green','North Carolina Ave',4],['green','Pennsylvania Ave',4],
  ['blue','Park Place',4],['blue','Boardwalk',4],
  ['rail','Reading Railroad',2],['rail','Pennsylvania Railroad',2],
  ['rail','B. & O. Railroad',2],['rail','Short Line',2],
  ['util','Electric Company',2],['util','Water Works',2]
];

/* [colours, value, count] */
var WILDS = [
  [['blue','green'],4,1], [['green','rail'],4,1], [['util','rail'],2,1],
  [['lblue','rail'],4,1], [['lblue','brown'],1,1],
  [['pink','orange'],2,2], [['red','yellow'],3,2],
  [ORDER,0,2]
];

/* [key, name, value, count, text] */
var ACTS = [
  ['dealbreaker','Deal Breaker',5,2,'Steal a complete set from any player.'],
  ['justsayno','Just Say No',4,3,'Cancel an action card played against you.'],
  ['slydeal','Sly Deal',3,3,'Steal a property that is not in a complete set.'],
  ['forceddeal','Forced Deal',3,3,'Swap one of your properties for another player\u2019s.'],
  ['debtcollector','Debt Collector',3,3,'Force one player to pay you 5M.'],
  ['birthday','It\u2019s My Birthday',2,3,'Every player pays you 2M.'],
  ['doublerent','Double The Rent',1,2,'Play with a rent card to double the rent. Free action.'],
  ['house','House',3,3,'Add to a complete set. Rent goes up by 3M.'],
  ['hotel','Hotel',4,2,'Add to a set that has a house. Rent goes up by 4M.'],
  ['passgo','Pass Go',1,10,'Draw 2 cards.']
];

var RENTS = [
  [['blue','green'],1,2], [['red','yellow'],1,2], [['pink','orange'],1,2],
  [['lblue','brown'],1,2], [['rail','util'],1,2],
  [ORDER,3,3]
];

var MONEY = [[1,6],[2,5],[3,3],[4,3],[5,2],[10,1]];
var MCOL  = {1:'#efe1c0',2:'#bfe3a6',3:'#a3d3e9',4:'#f8ca6d',5:'#eda3c4',10:'#c9a9ee'};

/* ══════════════ HELPERS ══════════════ */
var _uid = 0;
function mk(o){ o.uid = 'k' + (++_uid); return o; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.random()*(i+1)|0; var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
function el(id){ return document.getElementById(id); }

function buildDeck(){
  var d=[];
  MONEY.forEach(function(m){ for(var i=0;i<m[1];i++) d.push(mk({t:'money',v:m[0]})); });
  PROPS.forEach(function(p){ d.push(mk({t:'prop',color:p[0],name:p[1],v:p[2]})); });
  WILDS.forEach(function(w){ for(var i=0;i<w[2];i++) d.push(mk({t:'wild',cols:w[0].slice(),v:w[1],rain:w[0].length>2})); });
  ACTS.forEach(function(a){ for(var i=0;i<a[3];i++) d.push(mk({t:'act',act:a[0],name:a[1],v:a[2],desc:a[4]})); });
  RENTS.forEach(function(r){ for(var i=0;i<r[2];i++) d.push(mk({t:'rent',cols:r[0].slice(),v:r[1],wild:r[0].length>2})); });
  return shuffle(d);
}

function cardLabel(c){
  if(c.t==='money') return c.v+'M';
  if(c.t==='prop')  return c.name;
  if(c.t==='wild')  return c.rain ? 'Wild Property' : (CLR[c.cols[0]].n+'/'+CLR[c.cols[1]].n+' Wild');
  if(c.t==='rent')  return c.wild ? 'Wild Rent' : ('Rent: '+CLR[c.cols[0]].n+'/'+CLR[c.cols[1]].n);
  return c.name;
}

/* ══════════════ CARD FACES ══════════════ */
function rentRows(k){
  return k.r.map(function(v,i){
    return '<div class="r"><span>'+(i+1)+' card'+(i?'s':'')+'</span><b>'+v+'M</b></div>';
  }).join('');
}
function txt(k){ return k.d ? '#111' : '#fff'; }

function face(c){
  var h='';
  if(c.t==='money'){
    return '<div class="moneyface" style="background:'+MCOL[c.v]+'">'+
      '<div class="big">'+c.v+'</div><div class="sub">Million</div></div>';
  }
  if(c.t==='prop'){
    var k=CLR[c.color];
    return '<div class="val">'+c.v+'M</div>'+
      '<div class="band h1" style="background:'+k.c+';color:'+txt(k)+'">'+esc(c.name)+'</div>'+
      '<div class="rents">'+rentRows(k)+'</div>';
  }
  if(c.t==='wild'){
    if(c.rain){
      return '<div class="val">'+c.v+'M</div>'+
        '<div class="band h1 rainbow">Property<br>Wild Card</div>'+
        '<div class="desc">Any colour. Never completes a set alone.</div>';
    }
    var a=CLR[c.cols[0]], b=CLR[c.cols[1]];
    return '<div class="val">'+c.v+'M</div>'+
      '<div class="split">'+
        '<div style="background:'+a.c+';color:'+txt(a)+'">'+a.n+'</div>'+
        '<div style="background:'+b.c+';color:'+txt(b)+'">'+b.n+'</div>'+
      '</div><div class="cols2"><div>'+rentRows(a)+'</div><div>'+rentRows(b)+'</div></div>';
  }
  if(c.t==='rent'){
    if(c.wild){
      return '<div class="val">'+c.v+'M</div>'+
        '<div class="band h1 rainbow"><span class="rentbig">RENT</span></div>'+
        '<div class="desc">One player, any colour you own.</div>';
    }
    var x=CLR[c.cols[0]], y=CLR[c.cols[1]];
    return '<div class="val">'+c.v+'M</div>'+
      '<div class="split">'+
        '<div style="background:'+x.c+';color:'+txt(x)+'">'+x.n+'</div>'+
        '<div style="background:'+y.c+';color:'+txt(y)+'">'+y.n+'</div>'+
      '</div>'+
      '<div class="band h2" style="background:#1b1b1b"><span class="rentbig">RENT</span></div>'+
      '<div class="desc">Every player pays you.</div>';
  }
  var bg = {dealbreaker:'#2b2b2b',justsayno:'#c0392b',slydeal:'#8e44ad',forceddeal:'#16a085',
            debtcollector:'#2c6fbb',birthday:'#e67e22',doublerent:'#7f8c8d',house:'#1e6b3d',
            hotel:'#b03a2e',passgo:'#c9a227'}[c.act] || '#333';
  return '<div class="val">'+c.v+'M</div><div class="val b">'+c.v+'M</div>'+
    '<div class="band h1" style="background:'+bg+'"><span class="actname">'+esc(c.name)+'</span></div>'+
    '<div class="desc">'+esc(c.desc||'')+'</div>';
}

function cardHTML(c, cls){
  return '<div class="card '+(cls||'')+'" data-uid="'+c.uid+'">'+face(c)+'</div>';
}

function miniHTML(c, asColor, cls){
  var k, nm;
  if(c.t==='prop'){ k=CLR[c.color]; nm=c.name; }
  else if(c.t==='wild'){
    k = CLR[asColor || c.cols[0]];
    nm = c.rain ? 'Wild' : (CLR[c.cols[0]].n+' / '+CLR[c.cols[1]].n);
  } else { k={c:'#555',n:c.name,d:0}; nm=c.name; }
  var band = (c.t==='wild' && c.rain)
    ? '<div class="mband rainbow">Wild</div>'
    : '<div class="mband" style="background:'+k.c+';color:'+txt(k)+'">'+esc(nm.slice(0,26))+'</div>';
  return '<div class="mini '+(cls||'')+'" data-uid="'+c.uid+'">'+band+
    '<div class="mtxt">'+esc(c.t==='wild'&&!c.rain ? 'Wild card' : (c.t==='wild'?'Any colour':k.n))+'</div>'+
    '<div class="mv">'+c.v+'M</div></div>';
}

/* ══════════════ GAME ENGINE (host only) ══════════════
   The host owns G and is the single source of truth. Guests send intents,
   the host validates, mutates, then pushes a filtered view to everyone.     */

var G = null;      // full game state
var PCB = null;    // callback awaiting a pending resolution

function byId(id){ for(var i=0;i<G.ps.length;i++) if(G.ps[i].id===id) return G.ps[i]; return null; }
function cur(){ return G.ps[G.turn]; }
function logm(s){ G.log.push(s); if(G.log.length>200) G.log.shift(); }

function newGame(seats){
  G = {
    ps: seats.map(function(s){ return {id:s.id, name:s.name, hand:[], bank:[], sets:{}}; }),
    deck: buildDeck(), disc: [], turn: 0, acts: 3,
    log: [], pending: null, winner: null, phase: 'play'
  };
  G.ps.forEach(function(p){ for(var i=0;i<5;i++) p.hand.push(drawCard()); });
  logm('Game on. Three complete sets of different colours wins.');
  beginTurn();
}

function drawCard(){
  if(!G.deck.length){
    if(!G.disc.length) return null;
    G.deck = shuffle(G.disc); G.disc = [];
    logm('Discard pile reshuffled into the deck.');
  }
  return G.deck.pop();
}

function beginTurn(){
  var p = cur();
  var n = p.hand.length === 0 ? 5 : 2;
  for(var i=0;i<n;i++){ var c = drawCard(); if(c) p.hand.push(c); }
  G.acts = 3; G.phase = 'play';
  logm('— ' + p.name + '\u2019s turn (drew ' + n + ') —');
}

function nextTurn(){
  G.turn = (G.turn + 1) % G.ps.length;
  beginTurn();
}

/* ---- set helpers ---- */
function setOf(p,c){ if(!p.sets[c]) p.sets[c] = {cards:[], house:null, hotel:null}; return p.sets[c]; }
function isFull(p,c){
  var s = p.sets[c]; if(!s) return false;
  if(s.cards.length < CLR[c].s) return false;
  return s.cards.some(function(x){ return !(x.t==='wild' && x.rain); });
}
function rentOf(p,c){
  var s = p.sets[c]; if(!s || !s.cards.length) return 0;
  var n = Math.min(s.cards.length, CLR[c].s);
  var r = CLR[c].r[n-1];
  if(isFull(p,c)){ if(s.house) r += 3; if(s.hotel) r += 4; }
  return r;
}
function fullSets(p){ return ORDER.filter(function(c){ return isFull(p,c); }); }
function addProp(p,c,card){ setOf(p,c).cards.push(card); }
function pullProp(p,c,uid){
  var s = p.sets[c]; if(!s) return null;
  var i = s.cards.findIndex(function(x){ return x.uid===uid; });
  if(i<0) return null;
  return s.cards.splice(i,1)[0];
}
function tidy(p){
  ORDER.forEach(function(c){
    var s = p.sets[c]; if(!s) return;
    if(!s.cards.length){
      if(s.house) p.bank.push(s.house);
      if(s.hotel) p.bank.push(s.hotel);
      delete p.sets[c];
    }
  });
}
function bestColor(p,c){
  if(c.t === 'prop') return c.color;
  var best = c.cols[0], score = -99;
  c.cols.forEach(function(col){
    var s = p.sets[col], n = s ? s.cards.length : 0, need = CLR[col].s;
    var sc = n >= need ? -1 : n*10 + (need - n === 1 ? 6 : 0);
    if(sc > score){ score = sc; best = col; }
  });
  return best;
}
function give(p,c,pref){
  if(c.t==='prop') addProp(p,c.color,c);
  else if(c.t==='wild') addProp(p, pref || bestColor(p,c), c);
  else p.bank.push(c);
}

/* ---- assets & payment ---- */
function assets(p){
  var a = [];
  p.bank.forEach(function(c){ a.push({loc:'bank', card:c}); });
  ORDER.forEach(function(col){
    var s = p.sets[col]; if(!s) return;
    s.cards.forEach(function(c){
      if(c.t==='wild' && c.rain) return;      /* no cash value — can't be handed over */
      a.push({loc:'prop', color:col, card:c});
    });
    if(s.house) a.push({loc:'house', color:col, card:s.house});
    if(s.hotel) a.push({loc:'hotel', color:col, card:s.hotel});
  });
  return a;
}
function worth(p){ return assets(p).reduce(function(s,x){ return s + x.card.v; }, 0); }

function transfer(from, to, uids){
  var snap = assets(from);
  uids.forEach(function(u){
    var a = snap.find(function(x){ return x.card.uid===u; });
    if(!a) return;
    if(a.loc==='bank'){
      var i = from.bank.findIndex(function(c){ return c.uid===u; });
      if(i>=0) from.bank.splice(i,1);
    } else if(a.loc==='prop'){ pullProp(from, a.color, u); }
    else if(a.loc==='house'){ from.sets[a.color].house = null; }
    else if(a.loc==='hotel'){ from.sets[a.color].hotel = null; }
    give(to, a.card);
  });
  tidy(from);
}

/* ---- hand ---- */
function pluck(p, uid){
  var i = p.hand.findIndex(function(c){ return c.uid===uid; });
  return i<0 ? null : p.hand.splice(i,1)[0];
}
function peek(p, uid){ return p.hand.find(function(c){ return c.uid===uid; }); }
function hasJSN(p){ return p.hand.some(function(c){ return c.t==='act' && c.act==='justsayno'; }); }

/* ══════════════ JUST SAY NO CHAIN ══════════════ */
function startJSN(actorId, targets, desc, done){
  G.pending = {kind:'jsn', actor:actorId, desc:desc, q:targets.slice(), i:0, res:{}, ask:null, chain:0};
  PCB = done;
  stepJSN();
}
function stepJSN(){
  var p = G.pending;
  while(p.i < p.q.length){
    var t = p.q[p.i];
    var tp = byId(t);
    if(tp && hasJSN(tp)){ p.ask = t; p.chain = 0; sync(); return; }
    p.res[t] = 'ok'; p.i++;
  }
  var res = p.res, cb = PCB;
  G.pending = null; PCB = null;
  if(cb) cb(res);
}
function handleJSN(pid, use, uid){
  var p = G.pending;
  if(!p || p.kind!=='jsn' || p.ask!==pid) return;
  var me = byId(pid);
  if(use){
    var c = peek(me, uid);
    if(!c || c.t!=='act' || c.act!=='justsayno'){
      c = me.hand.find(function(x){ return x.t==='act' && x.act==='justsayno'; });
    }
    if(c){
      pluck(me, c.uid); G.disc.push(c); p.chain++;
      logm(me.name + ' plays Just Say No.');
      var target = p.q[p.i];
      var other = (pid === target) ? p.actor : target;
      var op = byId(other);
      if(op && hasJSN(op)){ p.ask = other; sync(); return; }
    }
  }
  p.res[p.q[p.i]] = (p.chain % 2 === 1) ? 'blocked' : 'ok';
  if(p.chain % 2 === 1) logm(p.desc + ' was cancelled.');
  p.i++; p.chain = 0; p.ask = null;
  stepJSN();
}

/* ══════════════ PAYMENT ══════════════ */
function startPay(debts, toId, done){
  debts = debts.filter(function(d){ return d.amount > 0 && byId(d.pid); });
  if(!debts.length){ if(done) done(); return; }
  G.pending = {kind:'pay', to:toId, debts: debts.map(function(d){
    return {pid:d.pid, amount:d.amount, done:false};
  })};
  PCB = done;
  var to = byId(toId);
  G.pending.debts.forEach(function(d){
    var pl = byId(d.pid), w = worth(pl);
    if(w <= d.amount){
      var uids = assets(pl).map(function(a){ return a.card.uid; });
      if(uids.length) transfer(pl, to, uids);
      d.done = true;
      logm(pl.name + ' hands over everything (' + w + 'M).');
    }
  });
  payCheck();
}
function handlePay(pid, uids){
  var p = G.pending;
  if(!p || p.kind!=='pay') return;
  var d = p.debts.find(function(x){ return x.pid===pid && !x.done; });
  if(!d) return;
  var pl = byId(pid), av = assets(pl), sum = 0, ok = [];
  uids.forEach(function(u){
    var a = av.find(function(x){ return x.card.uid===u; });
    if(a){ sum += a.card.v; ok.push(u); }
  });
  if(sum < d.amount) return;
  transfer(pl, byId(p.to), ok);
  d.done = true;
  logm(pl.name + ' pays ' + sum + 'M to ' + byId(p.to).name + '.');
  payCheck();
}
function payCheck(){
  var p = G.pending;
  if(!p) return;
  if(p.debts.every(function(d){ return d.done; })){
    G.pending = null;
    var cb = PCB; PCB = null;
    if(cb) cb(); else sync();
  } else sync();
}

/* ══════════════ ACTION DISPATCH ══════════════ */
function sync(){
  if(G){
    G.ps.forEach(function(p){ if(fullSets(p).length >= 3 && !G.winner){ G.winner = p.id; logm('🏆 ' + p.name + ' wins with three sets!'); } });
    if(G.winner) G.phase = 'over';
  }
  pushState();
}

function doAction(pid, m){
  if(!G) return;
  if(m.a === 'jsn'){ handleJSN(pid, m.use, m.uid); return; }
  if(m.a === 'pay'){ handlePay(pid, m.uids); return; }
  if(G.winner) return;
  if(G.pending) return;

  var p = byId(pid); if(!p) return;

  if(m.a === 'moveWild'){
    if(pid !== cur().id) return;
    var mv = pullProp(p, m.from, m.uid);
    if(mv && mv.t === 'wild' && mv.cols.indexOf(m.to) >= 0){
      addProp(p, m.to, mv); tidy(p);
      logm(p.name + ' moved a wild card to ' + CLR[m.to].n + '.');
    } else if(mv) addProp(p, m.from, mv);
    sync(); return;
  }

  if(pid !== cur().id) return;

  if(G.phase === 'discard'){
    if(m.a === 'discard'){
      (m.uids||[]).forEach(function(u){ var c = pluck(p,u); if(c) G.disc.push(c); });
      if(p.hand.length <= 7){ logm(p.name + ' discarded down to 7.'); nextTurn(); }
      sync();
    }
    return;
  }

  if(m.a === 'endTurn'){
    if(p.hand.length > 7){ G.phase = 'discard'; sync(); return; }
    nextTurn(); sync(); return;
  }

  if(G.acts <= 0) return;

  if(m.a === 'bank'){
    var c = peek(p, m.uid);
    if(!c || c.t==='prop' || c.t==='wild') return;
    pluck(p, m.uid); p.bank.push(c); G.acts--;
    logm(p.name + ' banks ' + cardLabel(c) + ' (' + c.v + 'M).');
    sync(); return;
  }

  if(m.a === 'playProp'){
    var c2 = peek(p, m.uid);
    if(!c2 || (c2.t!=='prop' && c2.t!=='wild')) return;
    var col = c2.t === 'prop' ? c2.color : m.color;
    if(c2.t === 'wild' && c2.cols.indexOf(col) < 0) return;
    pluck(p, m.uid); addProp(p, col, c2); G.acts--;
    logm(p.name + ' plays ' + cardLabel(c2) + ' into ' + CLR[col].n + '.');
    sync(); return;
  }

  if(m.a === 'playRent'){ playRent(p, m); return; }
  if(m.a === 'playAct'){ playAct(p, m); return; }
}

/* ══════════════ RENT ══════════════ */
function playRent(p, m){
  var c = peek(p, m.uid);
  if(!c || c.t !== 'rent') return;
  var col = m.color;
  if(c.cols.indexOf(col) < 0) return;
  var base = rentOf(p, col);
  if(base <= 0) return;

  var dbl = (m.doubles || []).filter(function(u){
    var d = peek(p, u); return d && d.t==='act' && d.act==='doublerent';
  });

  pluck(p, m.uid); G.disc.push(c);
  G.acts--;                                   /* rent costs one action */
  dbl.forEach(function(u){ var d = pluck(p, u); if(d) G.disc.push(d); });
  /* Double The Rent is deliberately free — house rule, no action cost */

  var amt = base * Math.pow(2, dbl.length);
  var targets = c.wild
    ? [m.target]
    : G.ps.filter(function(x){ return x.id !== p.id; }).map(function(x){ return x.id; });
  targets = targets.filter(function(t){ return t && byId(t); });
  if(!targets.length){ sync(); return; }

  logm(p.name + ' charges ' + amt + 'M rent on ' + CLR[col].n +
       (dbl.length ? ' (doubled ×' + Math.pow(2, dbl.length) + ')' : '') + '.');

  startJSN(p.id, targets, 'The rent', function(res){
    var debts = targets.filter(function(t){ return res[t] === 'ok'; })
                       .map(function(t){ return {pid:t, amount:amt}; });
    startPay(debts, p.id, function(){ sync(); });
  });
}

/* ══════════════ ACTION CARDS ══════════════ */
function playAct(p, m){
  var c = peek(p, m.uid);
  if(!c || c.t !== 'act') return;
  var k = c.act;
  if(k === 'justsayno' || k === 'doublerent') return;   /* reactive / paired only */

  /* --- validate before spending the card --- */
  var t = m.target ? byId(m.target) : null;

  if(k === 'house' || k === 'hotel'){
    if(!m.color || !isFull(p, m.color)) return;
    if(m.color === 'rail' || m.color === 'util') return;
    var s = setOf(p, m.color);
    if(k === 'house' && s.house) return;
    if(k === 'hotel' && (!s.house || s.hotel)) return;
    pluck(p, m.uid); G.acts--;
    if(k === 'house') s.house = c; else s.hotel = c;
    logm(p.name + ' builds a ' + k + ' on ' + CLR[m.color].n + '.');
    sync(); return;
  }

  if(k === 'passgo'){
    pluck(p, m.uid); G.disc.push(c); G.acts--;
    var got = 0;
    for(var i=0;i<2;i++){ var d = drawCard(); if(d){ p.hand.push(d); got++; } }
    logm(p.name + ' plays Pass Go and draws ' + got + '.');
    sync(); return;
  }

  if(k === 'birthday'){
    var all = G.ps.filter(function(x){ return x.id !== p.id; }).map(function(x){ return x.id; });
    if(!all.length) return;
    pluck(p, m.uid); G.disc.push(c); G.acts--;
    logm('It\u2019s ' + p.name + '\u2019s birthday — everyone owes 2M.');
    startJSN(p.id, all, 'The birthday gift', function(res){
      var debts = all.filter(function(x){ return res[x]==='ok'; })
                     .map(function(x){ return {pid:x, amount:2}; });
      startPay(debts, p.id, function(){ sync(); });
    });
    return;
  }

  if(k === 'debtcollector'){
    if(!t || t.id === p.id) return;
    pluck(p, m.uid); G.disc.push(c); G.acts--;
    logm(p.name + ' sends a Debt Collector after ' + t.name + ' for 5M.');
    startJSN(p.id, [t.id], 'The debt', function(res){
      if(res[t.id] === 'ok') startPay([{pid:t.id, amount:5}], p.id, function(){ sync(); });
      else sync();
    });
    return;
  }

  if(k === 'slydeal'){
    if(!t || t.id === p.id) return;
    if(!m.color || isFull(t, m.color)) return;
    var st = t.sets[m.color];
    if(!st || !st.cards.some(function(x){ return x.uid === m.card; })) return;
    pluck(p, m.uid); G.disc.push(c); G.acts--;
    logm(p.name + ' plays Sly Deal on ' + t.name + '.');
    startJSN(p.id, [t.id], 'The Sly Deal', function(res){
      if(res[t.id] === 'ok'){
        var got = pullProp(t, m.color, m.card);
        if(got){ tidy(t); give(p, got, got.t==='wild' ? bestColor(p,got) : null);
          logm(p.name + ' takes ' + cardLabel(got) + ' from ' + t.name + '.'); }
      }
      sync();
    });
    return;
  }

  if(k === 'forceddeal'){
    if(!t || t.id === p.id) return;
    if(!m.color || isFull(t, m.color)) return;
    if(!m.myColor || isFull(p, m.myColor)) return;
    var theirSet = t.sets[m.color], mySet = p.sets[m.myColor];
    if(!theirSet || !theirSet.cards.some(function(x){ return x.uid === m.card; })) return;
    if(!mySet || !mySet.cards.some(function(x){ return x.uid === m.myCard; })) return;
    pluck(p, m.uid); G.disc.push(c); G.acts--;
    logm(p.name + ' proposes a Forced Deal with ' + t.name + '.');
    startJSN(p.id, [t.id], 'The Forced Deal', function(res){
      if(res[t.id] === 'ok'){
        var theirs = pullProp(t, m.color, m.card);
        var mine   = pullProp(p, m.myColor, m.myCard);
        if(theirs) give(p, theirs, theirs.t==='wild' ? bestColor(p,theirs) : null);
        if(mine)   give(t, mine,   mine.t==='wild'   ? bestColor(t,mine)   : null);
        tidy(t); tidy(p);
        logm(p.name + ' swaps ' + (mine?cardLabel(mine):'?') + ' for ' + (theirs?cardLabel(theirs):'?') + '.');
      }
      sync();
    });
    return;
  }

  if(k === 'dealbreaker'){
    if(!t || t.id === p.id) return;
    if(!m.color || !isFull(t, m.color)) return;
    pluck(p, m.uid); G.disc.push(c); G.acts--;
    logm(p.name + ' plays Deal Breaker on ' + t.name + '\u2019s ' + CLR[m.color].n + ' set.');
    startJSN(p.id, [t.id], 'The Deal Breaker', function(res){
      if(res[t.id] === 'ok'){
        var s = t.sets[m.color];
        if(s){
          var mine2 = setOf(p, m.color);
          s.cards.forEach(function(x){ mine2.cards.push(x); });
          if(s.house && !mine2.house) mine2.house = s.house; else if(s.house) p.bank.push(s.house);
          if(s.hotel && !mine2.hotel) mine2.hotel = s.hotel; else if(s.hotel) p.bank.push(s.hotel);
          delete t.sets[m.color];
          logm(p.name + ' seizes the ' + CLR[m.color].n + ' set.');
        }
      }
      sync();
    });
    return;
  }
}

/* ══════════════ VIEWS & NETWORK ══════════════ */
function viewFor(pid){
  var pend = null;
  if(G.pending){
    if(G.pending.kind === 'jsn'){
      pend = {kind:'jsn', ask:G.pending.ask, actor:G.pending.actor,
              desc:G.pending.desc, victim:G.pending.q[G.pending.i]};
    } else {
      pend = {kind:'pay', to:G.pending.to,
              debts:G.pending.debts.map(function(d){ return {pid:d.pid, amount:d.amount, done:d.done}; })};
    }
  }
  return {
    you: pid, turn: G.ps[G.turn].id, acts: G.acts, phase: G.phase, winner: G.winner,
    deck: G.deck.length, disc: G.disc.length, log: G.log.slice(-40), pending: pend,
    ps: G.ps.map(function(p){
      return {id:p.id, name:p.name, bank:p.bank, sets:p.sets,
              hc:p.hand.length, hand: p.id===pid ? p.hand : null};
    })
  };
}

var NET = {host:false, peer:null, conns:[], hostConn:null, me:null, code:null, seats:[], nextSeat:1};
var V = null;      // my view of the game
var PICK = null;   // transient UI selection state

function pushState(){
  NET.conns.forEach(function(c){ if(c.open && c.pid) try{ c.send({t:'state', v:viewFor(c.pid)}); }catch(e){} });
  V = viewFor(NET.me);
  render();
}
function pushLobby(){
  var list = NET.seats.map(function(s){ return {id:s.id, name:s.name}; });
  NET.conns.forEach(function(c){ if(c.open) try{ c.send({t:'lobby', seats:list, code:NET.code}); }catch(e){} });
  renderLobby();
}
function act(m){
  closeModal();
  if(NET.host) doAction(NET.me, m);
  else if(NET.hostConn && NET.hostConn.open) NET.hostConn.send({t:'act', m:m});
}

function toast(s, ms){
  var t = el('toast'); t.textContent = s; t.style.display='block';
  clearTimeout(toast._h); toast._h = setTimeout(function(){ t.style.display='none'; }, ms||2600);
}

var PREFIX = 'mdealroom-';

function startHost(name){
  NET.host = true; NET.me = 'p0';
  NET.seats = [{id:'p0', name:name}];
  tryCode(0, name);
}
function tryCode(attempt, name){
  if(attempt > 6){ lobbyErr('Could not reserve a room code. Check your connection and try again.'); return; }
  var code = String(1000 + Math.floor(Math.random()*9000));
  NET.code = code;
  lobbyBusy('Opening room…');
  var peer = new Peer(PREFIX + code, {debug:0});
  peer.on('connection', onGuest);
  peer.on('open', function(){
    NET.peer = peer;
    LSTATE.busy = ''; LSTATE.err = '';
    renderLobby();
  });
  peer.on('error', function(e){
    if(e && (e.type === 'unavailable-id')){ try{peer.destroy();}catch(x){} tryCode(attempt+1, name); return; }
    if(e && e.type === 'peer-unavailable') return;
    lobbyErr('Connection problem: ' + (e && e.type ? e.type : 'unknown') + '. Retry in a moment.');
  });
}
function onGuest(conn){
  conn.on('open', function(){
    if(G){ conn.send({t:'full'}); setTimeout(function(){ try{conn.close();}catch(e){} },400); return; }
    if(NET.seats.length >= 5){ conn.send({t:'full'}); setTimeout(function(){ try{conn.close();}catch(e){} },400); return; }
    NET.conns.push(conn);
  });
  conn.on('data', function(d){
    if(!d) return;
    if(d.t === 'hello'){
      var id = 'p' + (NET.nextSeat++);
      conn.pid = id;
      NET.seats.push({id:id, name:(d.name||'Player').slice(0,14)});
      conn.send({t:'seat', id:id});
      pushLobby();
      if(G) conn.send({t:'state', v:viewFor(id)});
    } else if(d.t === 'act' && conn.pid){
      doAction(conn.pid, d.m);
    }
  });
  conn.on('close', function(){
    NET.conns = NET.conns.filter(function(c){ return c !== conn; });
    if(!G){ NET.seats = NET.seats.filter(function(s){ return s.id !== conn.pid; }); pushLobby(); }
    else { toast('A player disconnected.'); }
  });
  conn.on('error', function(){});
}

function startJoin(name, code){
  NET.host = false;
  lobbyBusy('Looking for room ' + code + '…');
  var settled = false;
  var peer = new Peer({debug:0});
  NET.peer = peer;
  peer.on('open', function(){
    var conn = peer.connect(PREFIX + code, {reliable:true});
    NET.hostConn = conn;
    var timer = setTimeout(function(){
      if(!settled) lobbyErr('No room with code ' + code + '. Check the digits, and make sure the host still has the page open.');
    }, 9000);
    conn.on('open', function(){ settled = true; clearTimeout(timer); conn.send({t:'hello', name:name}); });
    conn.on('data', function(d){
      if(!d) return;
      if(d.t === 'seat'){ NET.me = d.id; }
      else if(d.t === 'lobby'){ NET.seats = d.seats; NET.code = d.code; renderLobby(); }
      else if(d.t === 'state'){ V = d.v; render(); }
      else if(d.t === 'full'){ settled = true; clearTimeout(timer); lobbyErr('That room is full or already playing.'); }
    });
    conn.on('close', function(){ toast('Lost the connection to the host.', 6000); });
    conn.on('error', function(){});
  });
  peer.on('error', function(e){
    if(settled) return;
    if(e && e.type === 'peer-unavailable'){ lobbyErr('No room with code ' + code + '. Check the digits and try again.'); return; }
    lobbyErr('Connection problem: ' + (e && e.type ? e.type : 'unknown') + '.');
  });
}

var LSTATE = {view:'home', name:'', busy:'', err:''};

function lobbyErr(s){ LSTATE.busy=''; LSTATE.err=s; renderLobby(); }
function lobbyBusy(s){ LSTATE.busy=s; LSTATE.err=''; renderLobby(); }

  }
  else if(LSTATE.view === 'room'){
    h += '<div class="lbl">Room code</div><div class="code">'+esc(NET.code||'····')+'</div>';
    h += '<div class="lbl" style="margin-top:16px">Players ('+NET.seats.length+'/5)</div><ul class="plist">';
    NET.seats.forEach(function(s){
      h += '<li>'+esc(s.name)+(s.id===NET.me?' <span style="color:#8fb3a0">— you</span>':'')+
           (s.id==='p0'?' <span style="color:#8fb3a0">— host</span>':'')+'</li>';
    });
    h += '</ul>';
    if(NET.host){
      h += '<button class="btn" id="bStart" '+(NET.seats.length<2?'disabled':'')+
           ' style="width:100%">Start the game</button>'+
           (NET.seats.length<2?'<p class="hint" style="margin-top:8px">Waiting for at least one more player.</p>':'');
    } else {
      h += '<p class="hint">Waiting for the host to start.</p>';
    }
  }

  if(LSTATE.busy) h += '<p class="hint" style="margin-top:12px">'+esc(LSTATE.busy)+'</p>';
  h += '<div class="err">'+esc(LSTATE.err)+'</div>';

    cd.onkeydown = function(e){ if(e.key === 'Enter') el('bGo').click(); };
    if(LSTATE.name) cd.focus(); else if(n) n.focus();

/* ══════════════ TABLE RENDER ══════════════ */
function meV(){ return V.ps.find(function(p){ return p.id === V.you; }); }
function pV(id){ return V.ps.find(function(p){ return p.id === id; }); }
function myTurn(){ return V && V.turn === V.you; }
function bankTotal(p){ return p.bank.reduce(function(s,c){ return s + c.v; }, 0); }
function vFull(p,c){
  var s = p.sets[c]; if(!s) return false;
  if(s.cards.length < CLR[c].s) return false;
  return s.cards.some(function(x){ return !(x.t==='wild' && x.rain); });
}
function vRent(p,c){
  var s = p.sets[c]; if(!s || !s.cards.length) return 0;
  var r = CLR[c].r[Math.min(s.cards.length, CLR[c].s) - 1];
  if(vFull(p,c)){ if(s.house) r += 3; if(s.hotel) r += 4; }
  return r;
}
function vSets(p){ return ORDER.filter(function(c){ return vFull(p,c); }); }

function boardHTML(p, opts){
  opts = opts || {};
  var cols = ORDER.filter(function(c){ return p.sets[c] && p.sets[c].cards.length; });
  if(!cols.length) return '<div class="empty">No properties yet.</div>';
  return cols.map(function(c){
    var s = p.sets[c], done = vFull(p,c);
    var stack = s.cards.map(function(cd){
      var pk = opts.pickProp ? opts.pickProp(p, c, cd) : '';
      return miniHTML(cd, c, pk);
    }).join('');
    var bld = '';
    if(s.house) bld += '<span class="bpip">House</span>';
    if(s.hotel) bld += '<span class="bpip h">Hotel</span>';
    return '<div class="setcol'+(done?' done':'')+'" data-color="'+c+'">'+
      '<div class="stack">'+stack+'</div>'+
      (bld ? '<div class="bld">'+bld+'</div>' : '')+
      '<div class="setinfo">'+s.cards.length+'/'+CLR[c].s+' · <b>'+vRent(p,c)+'M</b></div>'+
    '</div>';
  }).join('');
}

function playerHTML(p, isMe){
  var sets = vSets(p).length;
  var h = '<div class="pl'+(V.turn===p.id?' active':'')+(isMe?' me':'')+'">';
  h += '<div class="plh"><span class="nm">'+esc(p.name)+(isMe?' (you)':'')+'</span>'+
       '<span class="tag'+(sets>=3?' win':'')+'">'+sets+'/3 sets</span>'+
       '<span class="tag">Bank '+bankTotal(p)+'M</span>'+
       '<span class="tag">'+(isMe ? p.hand.length : p.hc)+' in hand</span>';
  if(p.bank.length) h += '<span class="bank">'+p.bank.map(function(c){
      return '<span class="chip">'+(c.t==='money'? c.v+'M' : esc(cardLabel(c))+' '+c.v+'M')+'</span>';
    }).join('')+'</span>';
  h += '</div><div class="board">'+boardHTML(p)+'</div></div>';
  return h;
}

function render(){
  if(!V) return;
  el('lobby').style.display = 'none';
  el('game').style.display = 'flex';

  /* opponents, in seating order starting after me */
  var i0 = V.ps.findIndex(function(p){ return p.id === V.you; });
  var others = [];
  for(var k=1;k<V.ps.length;k++) others.push(V.ps[(i0+k) % V.ps.length]);
  el('others').innerHTML = others.map(function(p){ return playerHTML(p,false); }).join('');
  el('mine').innerHTML = playerHTML(meV(), true);

  var lb = el('logbox');
  lb.innerHTML = V.log.map(function(l){ return '<div>'+esc(l)+'</div>'; }).join('');
  lb.scrollTop = lb.scrollHeight;

  /* turn bar */
  var tb = '', turnName = pV(V.turn).name;
  if(V.winner){
    tb = '<span id="msg">🏆 '+esc(pV(V.winner).name)+' wins.</span>';
  } else if(V.phase === 'discard' && myTurn()){
    tb = '<span id="msg">Over the 7-card limit — choose cards to discard.</span>';
  } else if(myTurn()){
    var pips = '';
    for(var a=0;a<3;a++) pips += '<span class="pip'+(a < V.acts ? ' on' : '')+'"></span>';
    tb = '<span id="msg">Your turn</span><span class="pips">'+pips+'</span>'+
         '<span style="color:#a9c8b6">'+V.acts+' action'+(V.acts===1?'':'s')+' left</span>';
  } else {
    tb = '<span style="color:#a9c8b6">Waiting on <b style="color:#fff">'+esc(turnName)+'</b></span>';
  }
  tb += '<span style="margin-left:auto;display:flex;gap:6px;align-items:center">'+
        '<span class="tag">Deck '+V.deck+'</span>'+
        '<button class="btn ghost sm" id="bRules2" style="padding:3px 9px;font-size:12px">Rules</button></span>';
  el('turnbar').innerHTML = tb;
  var rb = el('bRules2'); if(rb) rb.onclick = rulesModal;

  /* hand */
  var me = meV();
  var discardMode = (V.phase === 'discard' && myTurn());
  PICK = PICK || {};
  if(!discardMode) PICK.discard = null;
  if(discardMode && !PICK.discard) PICK.discard = [];

  el('hand').innerHTML = me.hand.map(function(c){
    var cls = 'pick';
    if(discardMode && PICK.discard.indexOf(c.uid) >= 0) cls += ' sel';
    return cardHTML(c, cls);
  }).join('') || '<div class="empty" style="padding:30px 6px">Hand empty — you\u2019ll draw 5 next turn.</div>';

  Array.prototype.forEach.call(el('hand').querySelectorAll('.card'), function(node){
    node.onclick = function(){
      var c = me.hand.find(function(x){ return x.uid === node.dataset.uid; });
      if(!c) return;
      if(discardMode){
        var i = PICK.discard.indexOf(c.uid);
        if(i >= 0) PICK.discard.splice(i,1); else PICK.discard.push(c.uid);
        render(); return;
      }
      openCardMenu(c);
    };
  });

  /* controls */
  var ctl = '';
  if(discardMode){
    var need = me.hand.length - 7, sel = PICK.discard.length;
    ctl = '<button class="btn red sm" id="cDisc" '+(sel < need ? 'disabled' : '')+'>Discard '+sel+'/'+need+'</button>';
  } else if(myTurn() && !V.winner && !V.pending){
    ctl = '<button class="btn sm" id="cEnd">End turn</button>';
    if(hasMovableWild()) ctl += '<button class="btn ghost sm" id="cMove">Move a wild</button>';
  }
  el('ctl').innerHTML = ctl;
  var b;
  if(b = el('cEnd'))  b.onclick = function(){ act({a:'endTurn'}); };
  if(b = el('cDisc')) b.onclick = function(){ act({a:'discard', uids:PICK.discard.slice()}); PICK.discard=[]; };
  if(b = el('cMove')) b.onclick = moveWildFlow;

  routePending();
}

function hasMovableWild(){
  var me = meV(), found = false;
  ORDER.forEach(function(c){
    var s = me.sets[c]; if(!s) return;
    s.cards.forEach(function(cd){ if(cd.t === 'wild' && cd.cols.length > 1) found = true; });
  });
  return found;
}

/* ══════════════ MODALS ══════════════ */
var MODAL_LOCK = false;   /* pending prompts can't be dismissed */

function showModal(html, lock){
  MODAL_LOCK = !!lock;
  el('mbox').innerHTML = html;
  el('modal').classList.add('on');
}
function closeModal(){ MODAL_LOCK = false; el('modal').classList.remove('on'); el('mbox').innerHTML=''; }
el('modal').onclick = function(e){ if(e.target === el('modal') && !MODAL_LOCK) closeModal(); };
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !MODAL_LOCK) closeModal(); });

function head(title, sub){
  return '<h2 class="mtitle">'+esc(title)+'</h2>'+(sub?'<p class="msub">'+sub+'</p>':'');
}
function cancelBtn(){ return '<div class="mfoot"><button class="btn ghost sm" id="xCancel">Cancel</button></div>'; }
function wireCancel(){ var b = el('xCancel'); if(b) b.onclick = closeModal; }

/* ---- card tapped in hand ---- */
function openCardMenu(c){
  var can = myTurn() && !V.pending && !V.winner && V.acts > 0 && V.phase === 'play';
  var body = '<div class="mrow" style="justify-content:center">'+cardHTML(c)+'</div>';
  var opts = [];

  if(!can){
    body += '<p class="msub">'+(myTurn() ? 'No actions left this turn.' : 'Not your turn.')+'</p>';
  } else {
    if(c.t === 'prop'){
      opts.push(['Play into your '+CLR[c.color].n+' set','',function(){ act({a:'playProp',uid:c.uid,color:c.color}); }]);
    } else if(c.t === 'wild'){
      opts.push(['Play as a property','Pick which colour it joins',function(){ wildColorFlow(c); }]);
    } else {
      if(c.t === 'rent') opts.push(['Charge rent','',function(){ rentFlow(c); }]);
      if(c.t === 'act'){
        if(c.act === 'justsayno')       opts.push(['Kept for defence','It plays itself when someone targets you',null]);
        else if(c.act === 'doublerent') opts.push(['Attach to a rent card','Pick it while you are charging rent',null]);
        else opts.push(['Play '+c.name, c.desc, function(){ actionFlow(c); }]);
      }
      opts.push(['Put in your bank','Counts as '+c.v+'M towards rent and debts',function(){ act({a:'bank',uid:c.uid}); }]);
    }
  }

  body += opts.map(function(o,i){
    return '<button class="opt" data-i="'+i+'"'+(o[2]?'':' disabled style="opacity:.5"')+'>'+
      esc(o[0])+(o[1]?'<small>'+esc(o[1])+'</small>':'')+'</button>';
  }).join('');
  body += cancelBtn();
  showModal(head('Play this card') + body);
  wireCancel();
  Array.prototype.forEach.call(el('mbox').querySelectorAll('.opt'), function(n){
    var o = opts[+n.dataset.i];
    if(o && o[2]) n.onclick = o[2];
  });
}

/* ---- choose a colour for a wild ---- */
function wildColorFlow(c){
  var me = meV();
  var body = c.cols.map(function(col){
    var s = me.sets[col], n = s ? s.cards.length : 0;
    return '<button class="opt" data-c="'+col+'">'+CLR[col].n+
      '<small>you have '+n+' of '+CLR[col].s+'</small></button>';
  }).join('') + cancelBtn();
  showModal(head('Which colour?','This wild card can stand in for any of these.') + body);
  wireCancel();
  Array.prototype.forEach.call(el('mbox').querySelectorAll('.opt'), function(n){
    n.onclick = function(){ act({a:'playProp', uid:c.uid, color:n.dataset.c}); };
  });
}

/* ---- move a wild already on the table (free) ---- */
function moveWildFlow(){
  var me = meV(), items = [];
  ORDER.forEach(function(col){
    var s = me.sets[col]; if(!s) return;
    s.cards.forEach(function(cd){
      if(cd.t === 'wild' && cd.cols.length > 1) items.push({from:col, card:cd});
    });
  });
  var body = items.map(function(it,i){
    return '<button class="opt" data-i="'+i+'">'+esc(cardLabel(it.card))+
      '<small>currently in '+CLR[it.from].n+'</small></button>';
  }).join('') + cancelBtn();
  showModal(head('Move a wild card','Rearranging your own properties is free.') + body);
  wireCancel();
  Array.prototype.forEach.call(el('mbox').querySelectorAll('.opt'), function(n){
    n.onclick = function(){
      var it = items[+n.dataset.i];
      var dests = (it.card.rain ? ORDER : it.card.cols).filter(function(x){ return x !== it.from; });
      var b2 = dests.map(function(col){
        var s = me.sets[col], q = s ? s.cards.length : 0;
        return '<button class="opt" data-c="'+col+'">'+CLR[col].n+'<small>'+q+' of '+CLR[col].s+'</small></button>';
      }).join('') + cancelBtn();
      showModal(head('Move it where?') + b2);
      wireCancel();
      Array.prototype.forEach.call(el('mbox').querySelectorAll('.opt'), function(m){
        m.onclick = function(){ act({a:'moveWild', uid:it.card.uid, from:it.from, to:m.dataset.c}); };
      });
    };
  });
}

/* ---- opponent property picker ---- */
function propPicker(title, sub, filter, onPick){
  var index = {};                      /* uid -> {ownerId, color} */
  var groups = '';
  V.ps.forEach(function(p){
    if(p.id === V.you) return;
    var cols = ORDER.filter(function(c){ return p.sets[c] && p.sets[c].cards.length && filter(p,c); });
    if(!cols.length) return;
    groups += '<div class="grp"><div class="grph">'+esc(p.name)+'</div><div class="board">';
    cols.forEach(function(c){
      groups += '<div class="setcol"><div class="stack">';
      p.sets[c].cards.forEach(function(cd){
        index[cd.uid] = {owner:p.id, color:c, card:cd};
        groups += miniHTML(cd, c, 'pick');
      });
      groups += '</div><div class="setinfo">'+CLR[c].n+' · '+p.sets[c].cards.length+'/'+CLR[c].s+'</div></div>';
    });
    groups += '</div></div>';
  });
  if(!groups) groups = '<p class="msub">There is nothing you can take right now.</p>';
  showModal(head(title, sub) + groups + cancelBtn());
  wireCancel();
  Array.prototype.forEach.call(el('mbox').querySelectorAll('.mini.pick'), function(n){
    n.onclick = function(){
      var hit = index[n.dataset.uid];
      if(hit) onPick(pV(hit.owner), hit.color, hit.card);
    };
  });
}

/* ---- own property picker (Forced Deal, half two) ---- */
function myPropPicker(title, sub, onPick){
  var me = meV();
  var cols = ORDER.filter(function(c){ return me.sets[c] && me.sets[c].cards.length && !vFull(me,c); });
  var body = '';
  if(!cols.length) body = '<p class="msub">You have no property outside a complete set to offer.</p>';
  else {
    body += '<div class="board">';
    cols.forEach(function(c){
      body += '<div class="setcol"><div class="stack">'+
        me.sets[c].cards.map(function(cd){ return miniHTML(cd, c, 'pick'); }).join('')+
        '</div><div class="setinfo">'+CLR[c].n+'</div></div>';
    });
    body += '</div>';
  }
  showModal(head(title, sub) + body + cancelBtn());
  wireCancel();
  Array.prototype.forEach.call(el('mbox').querySelectorAll('.mini.pick'), function(n){
    n.onclick = function(){
      var col = null, cd = null;
      ORDER.forEach(function(c){
        var s = me.sets[c]; if(!s) return;
        s.cards.forEach(function(x){ if(x.uid === n.dataset.uid){ col = c; cd = x; } });
      });
      if(col) onPick(col, cd);
    };
  });
}

/* ---- player picker ---- */
function playerPicker(title, sub, onPick){
  var body = V.ps.filter(function(p){ return p.id !== V.you; }).map(function(p){
    return '<button class="opt" data-p="'+p.id+'">'+esc(p.name)+
      '<small>bank '+bankTotal(p)+'M · '+vSets(p).length+' complete sets</small></button>';
  }).join('') + cancelBtn();
  showModal(head(title, sub) + body);
  wireCancel();
  Array.prototype.forEach.call(el('mbox').querySelectorAll('.opt'), function(n){
    n.onclick = function(){ onPick(n.dataset.p); };
  });
}


/* ══════════════ RULES SHEET ══════════════ */
function rulesModal(){
  var h = head('How to play',
    'First to three complete sets in three different colours wins.');
  h += '<div class="grp"><div class="grph">A turn</div>'+
    '<p class="msub">Draw 2 at the start of your turn, or 5 if your hand is empty. '+
    'Then play up to three cards, in any mix: a property onto your board, '+
    'money or an action card into your bank, or an action card for its effect. '+
    'End your turn holding 7 cards or fewer.</p></div>';
  h += '<div class="grp"><div class="grph">Sets and rent</div>'+
    '<p class="msub">Each colour needs a set number of cards — 2 for brown and dark blue, '+
    '4 for railroads, 3 for most others. The more of a colour you hold, the higher the rent. '+
    'A house adds 3M and a hotel adds 4M to a completed set, but never on railroads or utilities. '+
    'A wild card stands in for any colour it shows, and you can shuffle your own wilds between '+
    'sets for free. A set made only of wilds does not count.</p></div>';
  h += '<div class="grp"><div class="grph">Paying up</div>'+
    '<p class="msub">Pay from your bank or straight off your property board — cards in your hand '+
    'are untouchable. No change is given, so overpaying hurts. If you cannot cover it, you hand '+
    'over everything you have and the debt is settled. Multi-colour wilds have no cash value, '+
    'so they can never be used to pay.</p></div>';
  h += '<div class="grp"><div class="grph">House rule in this build</div>'+
    '<p class="msub">Double The Rent is free. Attaching it to a rent card doubles the amount '+
    'without using up one of your three actions, so you can stack both of them onto a single '+
    'rent play. Everything else follows the standard rules.</p></div>';
  h += '<div class="mfoot"><button class="btn sm" id="xCancel">Close</button></div>';
  showModal(h);
  wireCancel();
}

/* ══════════════ ACTION FLOWS ══════════════ */
function actionFlow(c){
  var me = meV(), k = c.act;

  if(k === 'passgo'){ act({a:'playAct', uid:c.uid}); return; }

  if(k === 'house' || k === 'hotel'){
    var elig = vSets(me).filter(function(col){
      if(col === 'rail' || col === 'util') return false;
      var s = me.sets[col];
      return k === 'house' ? !s.house : (s.house && !s.hotel);
    });
    if(!elig.length){
      showModal(head('Nowhere to build',
        k === 'house'
          ? 'A house needs a complete set that has no house yet. Railroads and utilities can\u2019t be built on.'
          : 'A hotel needs a complete set that already has a house.') + cancelBtn());
      wireCancel(); return;
    }
    var body = elig.map(function(col){
      return '<button class="opt" data-c="'+col+'">'+CLR[col].n+
        '<small>rent goes from '+vRent(me,col)+'M to '+(vRent(me,col) + (k==='house'?3:4))+'M</small></button>';
    }).join('') + cancelBtn();
    showModal(head('Build a '+k, 'Choose a complete set.') + body);
    wireCancel();
    Array.prototype.forEach.call(el('mbox').querySelectorAll('.opt'), function(n){
      n.onclick = function(){ act({a:'playAct', uid:c.uid, color:n.dataset.c}); };
    });
    return;
  }

  if(k === 'birthday'){ act({a:'playAct', uid:c.uid}); return; }

  if(k === 'debtcollector'){
    playerPicker('Collect from whom?', 'They owe you 5M.', function(pid){
      act({a:'playAct', uid:c.uid, target:pid});
    });
    return;
  }

  if(k === 'slydeal'){
    propPicker('Steal which property?', 'You can\u2019t touch a completed set.',
      function(p, col){ return !vFull(p, col); },
      function(t, col, cd){ act({a:'playAct', uid:c.uid, target:t.id, color:col, card:cd.uid}); });
    return;
  }

  if(k === 'forceddeal'){
    propPicker('Which property do you want?', 'Neither card may come from a completed set.',
      function(p, col){ return !vFull(p, col); },
      function(t, col, cd){
        myPropPicker('And what do you give up?', 'Going to ' + t.name + ' in exchange for ' + cardLabel(cd) + '.',
          function(myCol, myCd){
            act({a:'playAct', uid:c.uid, target:t.id, color:col, card:cd.uid,
                 myColor:myCol, myCard:myCd.uid});
          });
      });
    return;
  }

  if(k === 'dealbreaker'){
    propPicker('Take which complete set?', 'Houses and hotels come with it.',
      function(p, col){ return vFull(p, col); },
      function(t, col){ act({a:'playAct', uid:c.uid, target:t.id, color:col}); });
    return;
  }
}

/* ---- rent ---- */
function rentFlow(c){
  var me = meV();
  var opts = c.cols.filter(function(col){ return vRent(me, col) > 0; });
  if(!opts.length){
    showModal(head('No rent to charge','You don\u2019t own any property in the colours on this card.') + cancelBtn());
    wireCancel(); return;
  }
  var body = opts.map(function(col){
    return '<button class="opt" data-c="'+col+'">'+CLR[col].n+
      '<small>'+me.sets[col].cards.length+' card(s) · '+vRent(me,col)+'M rent</small></button>';
  }).join('') + cancelBtn();
  showModal(head('Charge rent on which colour?',
    c.wild ? 'A wild rent card hits one player of your choosing.'
           : 'Every other player pays.') + body);
  wireCancel();
  Array.prototype.forEach.call(el('mbox').querySelectorAll('.opt'), function(n){
    n.onclick = function(){ rentDoubles(c, n.dataset.c); };
  });
}

function rentDoubles(c, col){
  var me = meV();
  var dbl = me.hand.filter(function(x){ return x.t==='act' && x.act==='doublerent'; });
  var chosen = [];

  function finish(){
    if(c.wild){
      playerPicker('Charge which player?', 'They owe you ' + amount() + 'M.', function(pid){
        act({a:'playRent', uid:c.uid, color:col, target:pid, doubles:chosen.slice()});
      });
    } else {
      act({a:'playRent', uid:c.uid, color:col, doubles:chosen.slice()});
    }
  }
  function amount(){ return vRent(me,col) * Math.pow(2, chosen.length); }

  if(!dbl.length){ finish(); return; }

  function draw(){
    var body = '<div class="tally ok">Rent: '+amount()+'M</div>';
    body += dbl.map(function(d,i){
      return '<button class="paychip'+(chosen.indexOf(d.uid)>=0?' on':'')+'" data-u="'+d.uid+'" '+
        'style="margin-bottom:8px">Double The Rent '+(i+1)+'</button>';
    }).join('');
    body += '<p class="msub" style="margin-top:10px">These are free — they don\u2019t use up an action.</p>';
    body += '<div class="mfoot"><button class="btn ghost sm" id="xCancel">Cancel</button>'+
            '<button class="btn sm" id="xGo">Charge '+amount()+'M</button></div>';
    showModal(head('Double the rent?','Add as many as you like.') + body);
    wireCancel();
    el('xGo').onclick = finish;
    Array.prototype.forEach.call(el('mbox').querySelectorAll('.paychip'), function(n){
      n.onclick = function(){
        var i = chosen.indexOf(n.dataset.u);
        if(i>=0) chosen.splice(i,1); else chosen.push(n.dataset.u);
        draw();
      };
    });
  }
  draw();
}

/* ══════════════ PENDING PROMPTS ══════════════ */
var LAST_PENDING = '';
function routePending(){
  var p = V.pending, need = null, arg = null;
  if(p){
    if(p.kind === 'jsn' && p.ask === V.you){ need = 'jsn:' + p.victim + ':' + p.desc; arg = p; }
    else if(p.kind === 'pay'){
      var mine = p.debts.find(function(d){ return d.pid === V.you && !d.done; });
      if(mine){ need = 'pay:' + mine.amount + ':' + p.to; arg = mine; }
    }
  }
  var showing = el('modal').classList.contains('on');
  if(!need){ LAST_PENDING = ''; if(MODAL_LOCK) closeModal(); return; }
  if(need === LAST_PENDING && showing) return;
  LAST_PENDING = need;
  if(p.kind === 'jsn') jsnPrompt(p); else payPrompt(p, arg);
}

function jsnPrompt(p){
  var actorName = pV(p.actor).name;
  var victim = pV(p.victim);
  var againstYou = p.victim === V.you;
  var sub = againstYou
    ? esc(actorName) + ' played <b>' + esc(p.desc) + '</b> against you.'
    : esc(victim.name) + ' just said no to your <b>' + esc(p.desc) + '</b>.';
  var body = '<div class="mfoot" style="position:static">'+
    '<button class="btn ghost sm" id="jNo">Let it stand</button>'+
    '<button class="btn red sm" id="jYes">Just Say No</button></div>';
  showModal(head(againstYou ? 'Block it?' : 'Say no back?', sub) + body, true);
  el('jYes').onclick = function(){ act({a:'jsn', use:true}); };
  el('jNo').onclick  = function(){ act({a:'jsn', use:false}); };
}

function payPrompt(p, debt){
  var me = meV(), to = pV(p.to);
  var av = [];
  me.bank.forEach(function(c){ av.push({card:c, where:'bank'}); });
  ORDER.forEach(function(col){
    var s = me.sets[col]; if(!s) return;
    s.cards.forEach(function(c){
      if(c.t==='wild' && c.rain) return;
      av.push({card:c, where:CLR[col].n});
    });
    if(s.house) av.push({card:s.house, where:CLR[col].n});
    if(s.hotel) av.push({card:s.hotel, where:CLR[col].n});
  });
  var chosen = [];

  function total(){
    return chosen.reduce(function(s,u){
      var a = av.find(function(x){ return x.card.uid === u; });
      return s + (a ? a.card.v : 0);
    }, 0);
  }
  function draw(){
    var t = total(), ok = t >= debt.amount;
    var body = '<div class="tally '+(ok?'ok':'no')+'">Selected '+t+'M of '+debt.amount+'M</div>';
    body += '<div class="mrow">' + av.map(function(a){
      return '<button class="paychip'+(chosen.indexOf(a.card.uid)>=0?' on':'')+'" data-u="'+a.card.uid+'">'+
        '<b>'+a.card.v+'M</b> '+esc(cardLabel(a.card))+
        '<span style="color:#8fb3a0;font-size:11px">'+esc(a.where)+'</span></button>';
    }).join('') + '</div>';
    body += '<p class="msub">No change is given — anything you overpay is gone. '+
            'Properties you hand over go straight onto their board.</p>';
    body += '<div class="mfoot"><button class="btn sm" id="pGo"'+(ok?'':' disabled')+'>Pay '+t+'M</button></div>';
    showModal(head('You owe ' + to.name + ' ' + debt.amount + 'M',
      'Pay from your bank or your properties. Cards in your hand are safe.') + body, true);
    el('pGo').onclick = function(){ act({a:'pay', uids:chosen.slice()}); };
    Array.prototype.forEach.call(el('mbox').querySelectorAll('.paychip'), function(n){
      n.onclick = function(){
        var i = chosen.indexOf(n.dataset.u);
        if(i>=0) chosen.splice(i,1); else chosen.push(n.dataset.u);
        draw();
      };
    });
  }
  draw();
}

/* ══════════════ BOOT ══════════════ */
renderLobby();
window.addEventListener('beforeunload', function(e){
  if(G || V){ e.preventDefault(); e.returnValue = ''; }
});
